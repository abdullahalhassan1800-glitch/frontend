<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyStore Admin Panel</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta http-equiv="refresh" content="0; url=auth/login.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f7fb;
            color: #081529;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
            padding: 1.5rem;
        }
        .logo-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 1.25rem;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: #0d6efd;
            color: #fff;
            font-size: 1.5rem;
        }
        h1 { font-size: 1.375rem; font-weight: 700; margin: 0 0 0.375rem; }
        p { font-size: 0.9375rem; color: #6c7a91; margin: 0 0 1.5rem; }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            background: #0d6efd;
            color: #fff;
            font-weight: 600;
            font-size: 0.9375rem;
            text-decoration: none;
        }
        .btn:hover { background: #0b5ed7; color: #fff; }
    </style>
</head>
<body>
    <main>
        <div class="logo-icon">&#128722;</div>
        <h1>MyStore Admin Panel</h1>
        <p>Taking you to the sign-in page&hellip;</p>
        <a class="btn" href="auth/login.html">Continue to Sign In</a>
    </main>
</body>
</html>
