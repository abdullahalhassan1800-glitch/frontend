<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Products - MyStore Admin Panel</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="admin.css"></head><body><div class="main-wrapper"><header class="top-header"><div class="header-left"><button class="btn-hamburger" id="btnHamburger"><i class="bi bi-list"></i></button><div class="search-wrapper"><i class="bi bi-search"></i><input type="text" class="search-input" placeholder="Search products, orders, customers..."></div></div><div class="header-right"><button class="header-icon-btn"><i class="bi bi-bell"></i><span class="notification-badge">3</span></button><div class="user-menu"><div class="user-avatar">AH</div></div></div></header><main class="main-content"><div class="stats-grid"><div class="stat-card"><div class="stat-icon blue"><i class="bi bi-box-seam"></i></div><div class="stat-title">Total Products</div><div class="stat-value" id="statTotal">128</div></div><div class="stat-card"><div class="stat-icon green"><i class="bi bi-check-circle"></i></div><div class="stat-title">Active Products</div><div class="stat-value" id="statActive">110</div></div><div class="stat-card"><div class="stat-icon orange"><i class="bi bi-x-circle"></i></div><div class="stat-title">Out of Stock</div><div class="stat-value" id="statOos">12</div></div><div class="stat-card"><div class="stat-icon purple"><i class="bi bi-grid"></i></div><div class="stat-title">Categories</div><div class="stat-value" id="statCats">18</div></div></div><div class="products-section"><div class="section-header"><div><div class="section-title">Products</div><div class="section-subtitle">Manage your products, add new products or edit existing ones.</div></div><button class="btn-primary" id="addBtn"><i class="bi bi-plus"></i> Add Product</button></div><div class="filters-bar"><div class="search-wrapper" style="width:320px"><i class="bi bi-search"></i><input type="text" id="productSearch" class="search-input" placeholder="Search products..."></div><select class="form-select" id="categoryFilter" style="width:180px"><option value="">All Categories</option><option>Health</option><option>Electronics</option><option>Footwear</option><option>Bags</option></select><select class="form-select" id="statusFilter" style="width:180px"><option value="">All Status</option><option>Active</option><option>Inactive</option></select><button class="btn-ghost" id="resetBtn">Reset</button></div><div class="table-responsive"><table class="table"><thead><tr><th>#</th><th>Image</th><th>Product Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Featured</th><th>Actions</th></tr></thead><tbody id="productTableBody"></tbody></table></div><div class="pagination-wrapper"><div class="page-info" id="pageInfo"></div><nav><ul class="pagination" id="pagination"></ul></nav></div></div></main></div><div class="overlay" id="drawerOverlay"></div><div class="drawer" id="productDrawer"><div class="drawer-header"><h5 class="drawer-title" id="drawerTitle">Add New Product</h5><button class="btn-close" id="closeDrawerBtn"></button></div><div class="drawer-body"><form id="productForm"><div class="mb-3"><label class="form-label">Product Name *</label><input type="text" class="form-control" id="productName"></div></form></div><div class="drawer-footer"><button class="btn-ghost" id="cancelBtn">Cancel</button><button class="btn-primary" id="saveBtn">Save Product</button></div></div><div class="toast-container" id="toastContainer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="admin.js"></script></body></html>
